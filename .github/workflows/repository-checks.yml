name: Repository Checks
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    repository-quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with: { python-version: '3.12' }
            - uses: actions/setup-node@v4
              with: { node-version: '22' }
            - run: npm install --ignore-scripts
            - run: npm run audit
            - run: npm run format:check
    salesforce-code-analyzer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: '22' }
            - name: Install Salesforce CLI and Code Analyzer
              run: |
                  npm install --global @salesforce/cli
                  sf plugins install code-analyzer
            - name: Analyze Apex and LWC
              run: sf code-analyzer run --workspace force-app --severity-threshold 2 --output-file code-analyzer-results.sarif
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: code-analyzer-results
                  path: code-analyzer-results.sarif
